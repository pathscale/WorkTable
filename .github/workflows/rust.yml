name: Rust

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: versioned-publication
            args: "--features versioned-row-publication"
          - name: all-features
            args: "--all-features"

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: "true"
        add-job-id-key: "false"
    - name: Build
      run: cargo build --workspace --all-targets ${{ matrix.args }} --verbose
    - name: Run tests
      run: cargo test --workspace --all-targets ${{ matrix.args }} --verbose


  clippy_check:
    name: Clippy (${{ matrix.name }})
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets ${{ matrix.args }} -- -D warnings
