[package]
name = "worktable_dsl"
version = "1.0.0-beta.18.1"
edition = "2024"
license = "MIT"
description = "The worktable! schema language: its model and parser, readable outside the proc macro"
repository = "https://github.com/pathscale/WorkTable"

[dependencies]
# Exactly what `codegen/src/common` already used. The move adds no dependency
# and drops none; anything else would have made it a rewrite rather than a lift.
# `serde` came later, with the IR, and is optional for the reason given below.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
convert_case = "0.6"
indexmap = "2"
serde = { version = "1", features = ["derive"], optional = true }
# Only ever reached through the `json` feature, which only `worktable-schemas`
# needs. Kept out of `serde` so that turning the IR into data does not also
# pull a JSON writer in.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# The integration test builds as its own crate, which is what makes it evidence
# that this one is consumable from outside.
proc-macro2 = "1"
# Already in the workspace lock; used only by the `serde` feature test.
serde_json = "1"

# The schema language from a shell.
#
# Deliberately needs nothing beyond the default build. It is the binary a
# cross-implementation test runs on every case, so anything it required would
# be a thing that test could quietly be missing. Byte ranges on diagnostics
# appear when built with `spans` and are absent otherwise, which degrades the
# message rather than the check.
[[bin]]
name = "wt-dsl"
path = "src/bin/wt-dsl.rs"

# Every declaration under a directory, as JSON plus the canonical text this
# crate emits for it, so a cross-implementation check runs against the tables
# people actually wrote rather than a hand-written corpus that only covers what
# its author already understood.
[[bin]]
name = "worktable-schemas"
path = "src/bin/worktable-schemas.rs"
required-features = ["json"]

[features]
# The IR derives serde only on request. `worktable_codegen` depends on this
# crate and is a proc macro, so it is compiled for the host before anything
# else in a dependent's build; adding serde unconditionally would put a derive
# macro in front of every WorkTable user's first compile to serve consumers
# who are not the compiler. The designer and the migration planner turn it on.
serde = ["dep:serde"]
# `worktable-schemas` dumps declarations as JSON. Separate from `serde` because
# serialising the IR and shipping a JSON writer are different costs to ask of a
# dependent.
json = ["serde", "dep:serde_json"]
# Byte ranges on diagnostics, for an editor that wants to underline the
# offending token. Off by default for the same reason `serde` is: this crate is
# compiled for the host as part of `worktable_codegen` before anything else in
# a dependent's build, and span tracking is a cost the compiler does not need.
spans = ["proc-macro2/span-locations"]
# Mermaid class diagrams, and the relation guessing they rest on. Off by
# default because it is the one part of this crate that is not about the
# `worktable!` grammar: the language has no foreign keys, so `infer_relations`
# guesses links from a naming convention that WorkTable does not enforce and
# has no opinion about. That mapping belongs to the application that draws the
# diagram, next to whatever it does enforce. Kept here because it is written
# and tested, behind a flag so that turning it on is a decision.
uml = []
