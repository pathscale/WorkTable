[package]
name = "worktable_codegen"
version = "1.0.0-beta.19"
edition = "2024"
license = "MIT"
description = "Proc-macro companion crate for worktable: the worktable! macro and its derives."
repository = "https://github.com/pathscale/WorkTable"

[features]
s3-support = []
logical-index-persistence = []
# Compatibility no-op retained for downstream manifests.
versioned-row-publication = []

[lib]
name = "worktable_codegen"
path = "src/lib.rs"
proc-macro = true

[dependencies]
# The schema language, extracted so consumers other than this macro can read
# a declaration. See its crate docs for why that needed a separate crate.
# Name the pre-release floor explicitly while retaining the workspace's caret
# policy. beta.18.1 is the first DSL artifact that exports every validator this
# code generator calls; beta.18 was published before that API landed.
worktable_dsl = { path = "../dsl", version = "^1.0.0-beta.18.1" }
rkyv = { version = "0.8" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
convert_case = "0.6"
indexmap = "2"
